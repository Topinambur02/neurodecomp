services:
  keycloak-db:
    image: postgres:17.7-alpine
    env_file:
      - path: ./auth-service/envs/.env-db
        required: true
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {POSTGRES_USER} -d {POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    env_file:
      - path: ./auth-service/envs/.env-keycloak
        required: true
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./auth-service/realm/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./auth-service/scripts/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/opt/keycloak/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      GATEWAY_CONFIG: /app/configs/config.prod.json
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      example:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Temporary upstream for checking authenticated proxying; replace with real APIs.
  example:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:9000", "-text=Authenticated request reached the example API"]
    restart: unless-stopped

volumes:
  keycloak-db:
